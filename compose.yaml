# Local development environment: frontend, backend and PostgreSQL.
#
#   cp .env.example .env
#   docker compose up --build -d
#
# Source code is mounted into the containers; changes apply without rebuilding.
# The backend applies pending migrations on every start.
name: traveller

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?missing - run cp .env.example .env}
      POSTGRES_USER: ${POSTGRES_USER:?missing - run cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing - run cp .env.example .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    # No published port: only the backend reaches the database, via the
    # service name "db" on the internal Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    image: traveller-backend:dev
    # Apply pending migrations, then start the development server. Commands
    # given to `docker compose run backend ...` replace this and skip it.
    command: >-
      sh -c "python manage.py migrate --noinput
      && exec python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app:z
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    image: traveller-frontend:dev
    environment:
      API_PROXY_TARGET: http://backend:8000
      WATCH_POLLING: ${WATCH_POLLING:-false}
    volumes:
      - ./frontend:/app:z
      # Dependencies for the container (not the host's node_modules). The
      # entrypoint reinstalls them when package-lock.json changes.
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  frontend-node-modules:
