name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify standard production excludes the mock worker
        run: test ! -e dist/mockServiceWorker.js
      - name: Verify opt-in demo build
        run: |
          npm run build:demo
          test -s dist/mockServiceWorker.js
          test -f dist/index.html
      - name: Verify Vercel environment flag also builds the demo
        run: |
          VITE_DEMO_MODE=true npm run build
          test -s dist/mockServiceWorker.js
